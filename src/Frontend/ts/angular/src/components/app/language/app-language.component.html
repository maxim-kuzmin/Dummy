<button #button type="button">
  {{ data.currentLanguageValue }}
</button>
<ul #menu [style]="menuStyle()">
  @for (language of data.languages(); track language.key) {
  <li [attr.data-selected]="language.selected || null">
    <a [href]="language.url">{{ language.value }}</a>
  </li>
  }
</ul>
