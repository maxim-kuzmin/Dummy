@let currentLanguageName = data.currentLanguageName;
@let items = data.items();
@let menuStyle = data.menuStyle();

<button #button type="button">
  {{ currentLanguageName }}
</button>
<ul #menu [style]="menuStyle">
  @for (item of items; track item.code) {
  <li [attr.data-selected]="item.selected || null">
    <a [href]="item.url">{{ item.name }}</a>
  </li>
  }
</ul>
