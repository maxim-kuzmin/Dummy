<button #button type="button">
  {{ data.currentLanguageName }}
</button>
<ul #menu [style]="menuStyle()">
  @for (language of data.languages(); track language.code) {
  <li [attr.data-selected]="language.selected || null">
    <a [href]="language.url">{{ language.name }}</a>
  </li>
  }
</ul>
